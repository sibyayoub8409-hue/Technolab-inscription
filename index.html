<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>

    <!-- CSS INTÉGRÉ -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            width: 350px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        img.logo {
            width: 120px;
            margin-bottom: 15px;
        }

        h2 {
            margin-bottom: 20px;
            color: #222;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007BFF;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- METS TON LOGO ICI -->
        <img src="logo.png" class="logo">

        <h2>Formulaire d'inscription</h2>

        <form id="form">
            <input type="text" id="nom" placeholder="Nom complet" required>
            <input type="text" id="etablissement" placeholder="Établissement" required>
            <input type="text" id="contact" placeholder="Contact" required>

            <button type="submit">Envoyer</button>
        </form>

        <div id="message" class="message"></div>
    </div>

    <!-- JAVASCRIPT INTÉGRÉ -->
    <script>
        document.getElementById("form").addEventListener("submit", async function(e) {
            e.preventDefault();

            let nom = document.getElementById("nom").value;
            let etablissement = document.getElementById("etablissement").value;
            let contact = document.getElementById("contact").value;

            let data = {
                nom: nom,
                etablissement: etablissement,
                contact: contact
            };

            try {
                let response = await fetch("http://localhost:5500/inscription", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    document.getElementById("message").innerHTML = "✔ Inscription enregistrée !";
                    document.getElementById("form").reset();
                } else {
                    document.getElementById("message").innerHTML = "❌ Erreur lors de l’enregistrement";
                }
            } catch (err) {
                document.getElementById("message").innerHTML = "⚠ Le serveur JSON n'est pas lancé !";
            }
        });
    </script>

</body>
</html>
